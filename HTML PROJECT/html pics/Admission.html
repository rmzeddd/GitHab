<!DOCTYPE html>
<html lang="en">
<head>
  <title>ADMISSION PORTAL</title>
</head>
<body style="background-color: rgb(12, 116, 12);">

  <h1 style="border: 3px solid black; background-color: rgba(215, 166, 42, 0.741); text-align: center;">ADMISSION PAGE</h1>
    <p style="font-size: 20px;">Welcome to the Admission Portal. Please fill out the form below to apply for admission.</p>
  <section>
    <h2>APPLY FOR ADMISSION</h2>
    <form action="submit.html" method="post" onsubmit="return confirm('SURE KA NA BA SA COURSE MO WALA NA NIYANG BALIKAN TO HAHAHHAHAHAHAHHAHAHAHAHHAHAHAHAHHAHAHAHAHHAHAHAHAHHAHAHAHHAHHA')">
      <label style="font-size: 20px;" for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      <br><br>
      <label style="font-size: 20px;" for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <br><br>
      <label style="font-size: 20px;" for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone">
      <br><br>
      <label style="font-size: 20px;" for="course">Course of Interest:</label>
      <select name="course" id="course">
        <option value="BS Computer_Science">Computer Science</option>
        <option value="BS Civil Engineering">Civil Engineering</option>
        <option value="BS Nursing">Nursing</option>
        <option value="BS Psychology">Psychology</option>
      </select>
      <br><br>
      <input style="text-align: center;" type="submit" value="Submit">
    </form>
    <img src="html pics\images.jpg" alt="NOICE" style="position: absolute; top: 70px; right: 30px; width: 150px; height: auto;">
    <figcaption style="position: absolute; top: 220px; right: 20px; font-size: 10px; color: rgb(250, 242, 242);">IMONG REAKSYON SA PAG ADMISSION</figcaption>
  </section>
  <footer style="position: absolute; bottom: 0px; width: 100%; background-color: rgba(215, 166, 42, 0.741); text-align: center; padding: 5px;">
    <p style="font-size: 15px;">&trade; GAWA NG GROUP 6: Doroteo, Yabut, Bagarino, Ventinilla, Sabado &trade;</p>
</body>
</html>
