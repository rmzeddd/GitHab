<!DOCTYPE html>
<html>
<head>
  <title>ADMISSION PORTAL</title>
</head>
<body style="background-color: rgb(20, 135, 20); margin: 0; padding: 0; overflow-x:hidden;">
  <h1 style="border: 3px solid black; background-color: rgba(215, 166, 42, 0.741); text-align: center;">ADMISSION PAGE</h1>
  <p style="font-size: 20px;">Welcome to the Admission Portal. Please fill out the form below to apply for admission.</p>
  
  <section>
    <h2>-----APPLY FOR ADMISSION-----</h2>
    <form action="Congrats.html" method="post" onsubmit="return confirm('SURE KA NA BA SA COURSE MO? WALA NANG BALIKAN TO HAHAHA')">
      
      <div style="margin-bottom: 1px;">
        <label style="font-size: 20px; font-weight: bold; display: inline-block; width: 60px;" for="name" >Name:</label>
        <input type="text" id="name" name="name" required placeholder="Dela Cruz, Juan">
      </div>

      <div style="margin-bottom: 3px;">
        <label style="font-size: 20px; font-weight: bold; display: inline-block; width: 60px;" for="age">Age:</label>
        <input type="text" id="age" name="age" required  placeholder="Enter your age">
      </div>

      <div style="margin-bottom: 1px;">
        <label style="font-size: 15px; font-weight: bold; display: inline-block; width: 60px;" for="address">Address:</label>
        <input type="text" id="address" name="address" required placeholder="123 street, City, Country">
      </div>

      <div style="margin-bottom: 1px;">
        <label style="font-size: 18px; font-weight: bold; display: inline-block; width: 60px;" for="gender">Gender:</label>
        <select name="gender" id="gender">
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
          
        </select>
      </div>

      <div style="margin-bottom: 1px;">
        <label style="font-size: 20px; font-weight: bold; display: inline-block; width: 60px;" for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>

      <div style="margin-bottom: 1px;">
        <label style="font-size: 20px; font-weight: bold; display: inline-block; width: 60px;" for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="09123456789" pattern="[0-9]{10}" required>
      </div>
      <br>
      <div style="margin-bottom: 1px;">
        <label style="font-size: 20px; font-weight: bold; " for="course">Course of Interest:</label>
        <select name="course" id="course">
          <option value="" disabled selected>Select Course</option>
          <option value="BS Computer_Science">Computer Science</option>
          <option value="BS Information System">Information System</option>
          <option value="BS Data Science">Data Science</option>
          <option value="BS Civil Engineering">Civil Engineering</option>
          <option value="BS Nursing">Nursing</option>
          <option value="BS Psychology">Psychology</option>
          <option value="BS Midwifery">Midwifery</option>
        </select>
      </div>

      <div style="margin-top: 20px;">
        <button style="text-align: center;" type="submit" value="Submit">
          <span style="font-size: 20px; color: rgb(9, 9, 9); padding: 20px;">Submit</span>
        </button>
        <button style="text-align: center;" type="reset" value="Reset">
          <span style="font-size: 20px; color: rgb(9, 9, 9); padding: 20px;">Reset</span>
        </button>
      </div>

    </form>
    
    <img src="html pics\images.jpg" alt="NOICE" style="position: absolute; top: 70px; right: 50px; width: 150px; height: auto;">
    <figcaption style="position: absolute; top: 220px; right: 20px; font-size: 10px; color: rgb(250, 242, 242);">IKAW PAG NAG ADMISSION SA SCHOOL NA TO</figcaption>
    <img src="html pics\thinking monke.gif" alt="thinking" style="display: block; margin: 0 auto; width: 300px; height: auto; margin-top: -5px;">
  </section>

  <footer style="position: absolute; bottom: 0px; width: 100%; background-color: rgba(215, 166, 42, 0.741); text-align: center; padding: 5px;">
    <p style="font-size: 15px;">&trade; GAWA NG GROUP 6: Doroteo, Yabut, Bagarino, Ventinilla, Sabado &trade;</p>
  </footer>
</body>
</html>
